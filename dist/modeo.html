<title>MODEO Styling Studio</title>
<meta name="description" content="MODEO — an AI personal stylist that styles what you own.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap">
<style>/* MODEO design system — editorial monochrome */
:root {
  --ink: #0f0f0f;
  --ink-2: #2a2a2a;
  --charcoal: #3a3a3a;
  --stone: #77736c;
  --stone-2: #a19d95;
  --line: #dedad2;
  --line-2: #ebe8e1;
  --paper: #f5f3ee;
  --paper-2: #efece5;
  --white: #fffefb;
  --silver: #b9bcc0;
  --accent: #8c6d46; /* muted bronze, used sparingly */
  --danger: #8b2c2c;
  --ok: #3e5b45;

  --serif: "Cormorant Garamond", "Cormorant", "Bodoni Moda", Didot, "Times New Roman", serif;
  --sans: "Jost", "Futura", "Helvetica Neue", Arial, sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;

  --nav-w: 236px;
  --ease: cubic-bezier(0.2, 0.7, 0.1, 1);
  --shadow: 0 18px 50px -24px rgba(15, 15, 15, 0.35);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--ink); color: var(--paper); }

:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 3px; }

/* ---------- Typography ---------- */
.display { font-family: var(--serif); font-weight: 400; letter-spacing: -0.01em; line-height: 0.98; margin: 0; }
.display em { font-style: italic; }
.h-xl { font-size: clamp(44px, 6.4vw, 92px); }
.h-lg { font-size: clamp(36px, 4.6vw, 64px); }
.h-md { font-size: clamp(28px, 3vw, 40px); }
.h-sm { font-size: 26px; }
.eyebrow { font-family: var(--sans); font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--stone); font-weight: 500; }
.lede { font-size: 17px; color: var(--ink-2); max-width: 46ch; font-weight: 300; }
.muted { color: var(--stone); }
.small { font-size: 13px; }
.tiny { font-size: 11.5px; }
.hand { font-family: var(--hand); font-weight: 500; }
.rule { height: 1px; background: var(--line); border: 0; margin: 0; }
.serif-num { font-family: var(--serif); font-style: italic; }

/* ---------- Buttons ---------- */
.btn {
  --h: 44px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  height: var(--h); padding: 0 22px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper);
  font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 500;
  cursor: pointer; transition: background 0.25s var(--ease), color 0.25s var(--ease), transform 0.2s var(--ease), opacity 0.2s;
  white-space: nowrap; border-radius: 0;
}
.btn:hover { background: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--ink); color: var(--paper); }
.btn.light { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn.light:hover { background: transparent; color: var(--paper); }
.btn.sm { --h: 34px; padding: 0 14px; font-size: 10.5px; }
.btn.block { width: 100%; }
.link-btn { background: none; border: 0; padding: 0; cursor: pointer; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
.icon-btn { width: 36px; height: 36px; display: inline-grid; place-items: center; border: 1px solid var(--line); background: var(--white); cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.icon-btn:hover { border-color: var(--ink); }
.icon-btn.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ---------- Chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 13px; border: 1px solid var(--line); background: var(--white);
  font-size: 12.5px; cursor: pointer; transition: all 0.2s var(--ease); border-radius: 999px; white-space: nowrap;
}
.chip:hover { border-color: var(--ink); }
.chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip .sw { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); flex: none; }
.chip.owned::after { content: "Owned"; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; border-left: 1px solid currentColor; padding-left: 8px; opacity: 0.7; }

.tag { display: inline-flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; padding: 4px 8px; border: 1px solid var(--line); color: var(--stone); background: var(--white); white-space: nowrap; }
.tag.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.tag.owned { border-color: var(--ink); color: var(--ink); }
.tag.suggested { border-style: dashed; }
.tag.warn { border-color: #b08a3c; color: #7a5a17; background: #fbf5e6; }

/* ---------- Form ---------- */
.field { display: grid; gap: 6px; }
.field > span { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone); }
.input, .select, .textarea {
  width: 100%; height: 44px; padding: 0 14px; background: var(--white); border: 1px solid var(--line); border-radius: 0; outline: none; transition: border-color 0.2s;
}
.textarea { height: auto; min-height: 88px; padding: 12px 14px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--ink); }
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 34px; }
.check { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; font-size: 14px; }
.check input { appearance: none; width: 18px; height: 18px; border: 1px solid var(--ink); flex: none; margin-top: 2px; display: grid; place-items: center; cursor: pointer; background: var(--white); }
.check input:checked { background: var(--ink); }
.check input:checked::after { content: ""; width: 9px; height: 5px; border-left: 1.5px solid var(--paper); border-bottom: 1.5px solid var(--paper); transform: rotate(-45deg) translate(1px, -1px); }

/* ---------- Tabs ---------- */
.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { background: none; border: 0; padding: 12px 0; font-size: 11.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone); cursor: pointer; position: relative; white-space: nowrap; }
.tab.on { color: var(--ink); }
.tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1.5px; background: var(--ink); }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { border: 0; background: transparent; padding: 0 16px; height: 34px; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; cursor: pointer; }
.seg button.on { background: var(--ink); color: var(--paper); }

/* ---------- App shell ---------- */
.shell { min-height: 100dvh; display: grid; grid-template-columns: var(--nav-w) 1fr; }
.side {
  position: sticky; top: 0; height: 100dvh; background: var(--ink); color: var(--paper);
  display: flex; flex-direction: column; padding: 30px 22px 22px; gap: 28px; z-index: 30;
}
.brand { font-family: var(--serif); font-size: 34px; letter-spacing: 0.28em; font-weight: 500; line-height: 1; padding-left: 4px; }
.brand small { display: block; font-family: var(--sans); font-size: 9px; letter-spacing: 0.3em; color: #8c8a85; margin-top: 10px; font-weight: 400; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 14px; padding: 11px 10px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #a9a7a1; transition: color 0.2s, background 0.2s; position: relative; }
.nav a:hover { color: var(--paper); }
.nav a.on { color: var(--paper); }
.nav a.on::before { content: ""; position: absolute; left: -22px; top: 8px; bottom: 8px; width: 2px; background: var(--paper); }
.nav a .n { font-family: var(--serif); font-style: italic; font-size: 14px; letter-spacing: 0; width: 18px; color: #6f6d68; text-transform: none; }
.side-foot { margin-top: auto; display: grid; gap: 14px; }
.me { display: flex; gap: 12px; align-items: center; }
.me .av { width: 40px; height: 52px; background: #262626; overflow: hidden; flex: none; display: grid; place-items: center; color: #777; font-size: 10px; }
.me .av img { width: 100%; height: 100%; object-fit: cover; }
.status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #6b6b6b; margin-right: 8px; vertical-align: middle; }
.status-dot.on { background: #c9c3b3; box-shadow: 0 0 0 3px rgba(201, 195, 179, 0.15); }
.side .tiny { color: #8c8a85; letter-spacing: 0.04em; }

.main { min-width: 0; padding: 34px clamp(18px, 3.4vw, 52px) 60px; }
.topbar { display: none; }
.bottomnav { display: none; }

.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 26px; flex-wrap: wrap; }
.page-head .display { margin-top: 10px; }

/* ---------- Cards & panels ---------- */
.panel { background: var(--white); border: 1px solid var(--line); }
.pad { padding: 22px; }
.grid { display: grid; gap: 18px; }
.split { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: 28px; align-items: start; }
.sticky { position: sticky; top: 24px; }

/* ---------- Home ---------- */
.home { display: grid; grid-template-columns: 1.15fr 1fr; gap: 34px; min-height: calc(100dvh - 94px); align-items: stretch; }
.home-hero { display: flex; flex-direction: column; justify-content: space-between; gap: 30px; }
.actions { display: grid; border-top: 1px solid var(--ink); }
.action {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 16px;
  padding: 18px 4px; border-bottom: 1px solid var(--line); cursor: pointer; transition: padding 0.35s var(--ease), background 0.35s;
}
.action:hover { padding-left: 14px; background: var(--white); }
.action .num { font-family: var(--serif); font-style: italic; font-size: 22px; color: var(--stone); }
.action .t { font-family: var(--serif); font-size: clamp(22px, 2.2vw, 30px); line-height: 1.1; }
.action .d { font-size: 13px; color: var(--stone); margin-top: 3px; }
.action .arrow { transition: transform 0.35s var(--ease); }
.action:hover .arrow { transform: translateX(6px); }
.home-visual { position: relative; background: var(--paper-2); border: 1px solid var(--line); overflow: hidden; min-height: 520px; display: flex; flex-direction: column; }
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); }
.stat { padding: 16px 18px; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-family: var(--serif); font-size: 30px; font-weight: 400; line-height: 1; }

/* ---------- Look board (editorial collage) ---------- */
.board { position: relative; background: var(--white); overflow: hidden; }
.board-grid { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 1fr; gap: 6px; padding: 18px; height: 100%; }
.board-tile { position: relative; display: grid; place-items: center; cursor: pointer; transition: transform 0.45s var(--ease); min-height: 0; min-width: 0; }
.board-tile > svg, .board-tile > img { position: absolute; inset: 0; }
.board-tile:hover { transform: translateY(-3px); }
.board-tile svg, .board-tile img { width: 100%; height: 100%; object-fit: contain; }
.board-tile img.photo { object-fit: cover; box-shadow: var(--shadow); }
.board-tile .lbl { position: absolute; left: 0; bottom: -2px; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone); background: rgba(255,254,251,0.85); padding: 1px 4px; }
.board-tile .owned-dot { position: absolute; top: 2px; right: 2px; font-size: 8.5px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--ink); color: var(--paper); padding: 2px 5px; }
.board-tile.anchor::after { content: ""; position: absolute; inset: -6px; border: 1px solid var(--ink); pointer-events: none; opacity: 0; transition: opacity 0.3s; }
.board-tile.anchor:hover::after { opacity: 1; }
.board { height: 100%; }
.note {
  position: absolute; font-family: var(--hand); font-size: 19px; line-height: 1.02; color: var(--ink-2);
  max-width: 150px; pointer-events: none; z-index: 4; transform: rotate(-3deg);
  animation: ink 0.9s var(--ease) both; text-shadow: 0 0 6px var(--white), 0 0 2px var(--white);
}
.hero-note { bottom: 7%; right: -10%; text-align: left; }
.cloth-note { bottom: 0; left: -4%; }
.ink-circle { position: absolute; left: 24%; top: 34%; width: 52%; height: 34%; overflow: visible; pointer-events: none; z-index: 2; }
.ink-circle path { stroke: var(--ink-2); fill: none; stroke-width: 0.9; vector-effect: non-scaling-stroke; stroke-dasharray: 400; stroke-dashoffset: 400; animation: draw 1.4s 0.5s var(--ease) forwards; opacity: 0.75; }
.look-card .note, .panel .note, .saved-card .note { font-size: 16px; max-width: 118px; }
.note svg { position: absolute; overflow: visible; pointer-events: none; }
.note svg path { stroke: var(--ink-2); fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 1.1s 0.3s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ink { from { opacity: 0; transform: rotate(-3deg) translateY(4px); } to { opacity: 1; transform: rotate(-3deg); } }
.board-stamp { position: absolute; top: 14px; left: 18px; z-index: 3; }

/* ---------- Look cards ---------- */
.looks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.split > *, .tryon > *, .prof > *, .home > * { min-width: 0; }
.look-card { background: var(--white); border: 1px solid var(--line); display: flex; flex-direction: column; transition: border-color 0.3s, box-shadow 0.4s var(--ease); animation: rise 0.6s var(--ease) both; }
.look-card:hover { border-color: var(--stone-2); box-shadow: var(--shadow); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.look-card .board { aspect-ratio: 4 / 3.2; height: auto; border-bottom: 1px solid var(--line-2); }
.look-body { padding: 18px 20px 20px; display: grid; gap: 12px; }
.look-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.look-title { font-family: var(--serif); font-size: 28px; line-height: 1; }
.palette { display: flex; }
.palette span { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); margin-left: -4px; box-shadow: 0 0 0 2px var(--white); }
.pieces { display: grid; gap: 0; border-top: 1px solid var(--line-2); }
.piece-row { display: grid; grid-template-columns: 26px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line-2); font-size: 13.5px; }
.piece-row .sw { width: 14px; height: 14px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.12); }
.piece-row .role { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--stone); margin-right: 8px; }
.why { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
.why li { padding-left: 14px; position: relative; }
.why li::before { content: ""; position: absolute; left: 0; top: 9px; width: 6px; height: 1px; background: var(--ink); }
.why b { font-weight: 500; }
.card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }

/* ---------- Drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(15, 15, 15, 0.38); z-index: 60; animation: fade 0.3s var(--ease) both; backdrop-filter: blur(2px); }
@keyframes fade { from { opacity: 0; } }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(980px, 100vw); background: var(--paper); z-index: 61;
  display: flex; flex-direction: column; animation: slide 0.5s var(--ease) both; box-shadow: -30px 0 60px -30px rgba(0,0,0,0.4);
}
.drawer.narrow { width: min(560px, 100vw); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 24px 28px 18px; border-bottom: 1px solid var(--line); }
.drawer-body { flex: 1; overflow: auto; padding: 24px 28px 34px; }
.modal { position: fixed; z-index: 61; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px)); max-height: calc(100dvh - 40px); overflow: auto; background: var(--paper); padding: 28px; animation: rise 0.4s var(--ease) both; }

.style-panel { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 26px; }
.style-panel .board { aspect-ratio: 4 / 4.4; height: auto; border: 1px solid var(--line); }
.opt-group { display: grid; gap: 10px; padding: 14px 0; border-bottom: 1px solid var(--line-2); }
.opt-group:first-child { padding-top: 0; }

/* ---------- Upload / photo ---------- */
.drop {
  border: 1px dashed var(--stone-2); background: var(--white); display: grid; place-items: center; text-align: center; padding: 26px; cursor: pointer; transition: border-color 0.25s, background 0.25s; position: relative;
}
.drop:hover, .drop.over { border-color: var(--ink); background: #fff; }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.cropper { position: relative; aspect-ratio: 3 / 4; background: #1b1b1b; overflow: hidden; touch-action: none; cursor: grab; user-select: none; }
.cropper:active { cursor: grabbing; }
.cropper img { position: absolute; left: 50%; top: 50%; max-width: none; transform-origin: center; pointer-events: none; }
.cropper .guide { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(rgba(255,255,255,0.18) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.18) 1px, transparent 1px); background-size: 33.33% 33.33%; }
.cropper .silhouette { position: absolute; inset: 6% 26%; border: 1px dashed rgba(255,255,255,0.35); border-radius: 40% 40% 12% 12% / 14% 14% 6% 6%; pointer-events: none; }
.range { width: 100%; accent-color: var(--ink); }

/* ---------- Onboarding ---------- */
.onb { min-height: 100dvh; display: grid; grid-template-columns: 1fr 1fr; }
.onb-left { background: var(--ink); color: var(--paper); padding: 44px clamp(24px, 5vw, 72px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; position: relative; overflow: hidden; }
.onb-right { padding: 44px clamp(20px, 4vw, 64px); display: flex; flex-direction: column; gap: 22px; justify-content: center; max-width: 720px; }
.guides { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.guide-i { display: grid; gap: 8px; justify-items: center; text-align: center; font-size: 11px; color: #bdbab3; letter-spacing: 0.04em; }
.guide-i svg { width: 34px; height: 46px; }
.steps { display: flex; gap: 8px; }
.steps span { width: 28px; height: 2px; background: #444; }
.steps span.on { background: var(--paper); }
.privacy { border-left: 1px solid var(--ink); padding: 2px 0 2px 16px; display: grid; gap: 6px; font-size: 13px; color: var(--ink-2); }

/* ---------- Try-on ---------- */
.tryon { display: grid; grid-template-columns: 1fr 340px; gap: 26px; align-items: start; }
.stage { position: relative; background: #151515; aspect-ratio: 3 / 4; max-height: calc(100dvh - 170px); width: 100%; overflow: hidden; margin: 0 auto; }
.stage img { width: 100%; height: 100%; object-fit: contain; }
.compare { position: absolute; inset: 0; }
.compare .after { position: absolute; inset: 0; overflow: hidden; }
.compare .handle { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--paper); cursor: ew-resize; z-index: 3; }
.compare .handle::after { content: "⟷"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 38px; height: 38px; border-radius: 50%; background: var(--paper); color: var(--ink); display: grid; place-items: center; font-size: 14px; }
.stage .lbl { position: absolute; top: 14px; z-index: 4; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; background: rgba(15,15,15,0.7); color: var(--paper); padding: 5px 9px; }
.demo-banner { border: 1px solid #b08a3c; background: #fbf5e6; color: #5a4310; padding: 14px 16px; font-size: 13px; display: grid; gap: 4px; }
.demo-banner b { font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; }
.variants { display: grid; gap: 10px; }
.variant { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); background: var(--white); cursor: pointer; transition: border-color 0.2s; text-align: left; }
.variant.on, .variant:hover { border-color: var(--ink); }
.variant .mini { width: 64px; height: 64px; }
.loader { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(15,15,15,0.55); color: var(--paper); z-index: 5; text-align: center; }
.loader .bar { width: 160px; height: 1px; background: rgba(255,255,255,0.25); position: relative; overflow: hidden; margin: 14px auto 0; }
.loader .bar::after { content: ""; position: absolute; inset: 0; width: 40%; background: var(--paper); animation: load 1.3s var(--ease) infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }

/* ---------- Wardrobe ---------- */
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.filters .select { height: 36px; width: auto; min-width: 130px; font-size: 13px; }
.w-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
.w-item { background: var(--white); border: 1px solid var(--line); cursor: pointer; transition: border-color 0.25s, transform 0.4s var(--ease); display: flex; flex-direction: column; text-align: left; padding: 0; }
.w-item:hover { border-color: var(--ink); transform: translateY(-2px); }
.w-item .img { aspect-ratio: 1 / 1.15; display: grid; place-items: center; background: var(--paper-2); overflow: hidden; position: relative; }
.w-item .img img { width: 100%; height: 100%; object-fit: cover; }
.w-item .img svg { width: 72%; height: 72%; }
.w-item .meta { padding: 10px 12px 12px; display: grid; gap: 3px; }
.w-item .meta b { font-weight: 400; font-size: 13.5px; line-height: 1.3; }
.spin { width: 14px; height: 14px; border: 1.5px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Saved ---------- */
.gallery { columns: 3 260px; column-gap: 18px; }
.gallery > * { break-inside: avoid; margin-bottom: 18px; }
.saved-card { background: var(--white); border: 1px solid var(--line); cursor: pointer; transition: box-shadow 0.4s var(--ease); display: block; width: 100%; text-align: left; padding: 0; }
.saved-card:hover { box-shadow: var(--shadow); }
.saved-card .board { aspect-ratio: 4 / 4.2; height: auto; }
.saved-card .tryon-img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }

/* ---------- Profile ---------- */
.prof { display: grid; grid-template-columns: 300px 1fr; gap: 34px; align-items: start; }
.section { display: grid; gap: 12px; padding: 20px 0; border-bottom: 1px solid var(--line); }
.section h3 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 24px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.15); cursor: pointer; position: relative; transition: transform 0.2s; }
.swatch-btn:hover { transform: scale(1.08); }
.swatch-btn.on { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); }
.swatch-btn.avoid::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1.5px; background: var(--danger); transform: rotate(45deg); }

/* ---------- Toast ---------- */
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 20px; font-size: 13px; z-index: 90; animation: rise 0.35s var(--ease) both; letter-spacing: 0.02em; }

/* ---------- Misc ---------- */
.engine-badge { display: inline-flex; align-items: center; gap: 8px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone); }
.engine-badge i { width: 6px; height: 6px; border-radius: 50%; background: var(--stone-2); }
.engine-badge.ai i { background: var(--ink); }
.empty { border: 1px dashed var(--stone-2); padding: 40px 24px; text-align: center; display: grid; gap: 12px; justify-items: center; background: var(--white); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: grid; gap: 14px; }
.stack-sm { display: grid; gap: 8px; }
.hide-sm { }
.skeleton { background: linear-gradient(90deg, var(--line-2), var(--paper-2), var(--line-2)); background-size: 200% 100%; animation: sk 1.4s linear infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.fade-in { animation: fadeonly 0.5s var(--ease) both; }
@keyframes fadeonly { from { opacity: 0; } }
.nudges { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Responsive ---------- */
@media (max-width: 1180px) {
  .looks { grid-template-columns: minmax(0, 1fr); }
  .home { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .home-visual { min-height: 440px; }
  .style-panel { grid-template-columns: minmax(0, 1fr); }
  .style-panel .board { aspect-ratio: 4 / 3.4; }
}
@media (max-width: 1000px) {
  .split { grid-template-columns: minmax(0, 1fr) !important; }
  .sticky { position: static; }
  .tryon { grid-template-columns: minmax(0, 1fr); }
  .prof { grid-template-columns: minmax(0, 1fr); }
  .onb { grid-template-columns: minmax(0, 1fr); }
  .onb-left { padding-bottom: 34px; min-height: auto; }
}
@media (max-width: 820px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 30; background: var(--ink); color: var(--paper); height: 56px; align-items: center; justify-content: space-between; padding: 0 16px; }
  .topbar .brand { font-size: 22px; }
  .bottomnav { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; bottom: 0; left: 0; right: 0; z-index: 40; background: var(--paper); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .bottomnav a { display: grid; justify-items: center; gap: 3px; padding: 9px 2px 8px; font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--stone); text-align: center; }
  .bottomnav a.on { color: var(--ink); }
  .bottomnav a svg { width: 19px; height: 19px; }
  .main { padding: 22px 16px 96px; }
  .drawer-head { padding: 18px 16px 14px; }
  .drawer-body { padding: 18px 16px 90px; }
  .guides { grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .note { font-size: 15px; max-width: 110px; }
  .board-grid { padding: 10px; gap: 4px; }
  .look-title { font-size: 24px; }
  .stat b { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

/* board sizing helpers */
.board.fill { height: 100%; background: transparent; }
.board.compact .board-grid { padding: 3px; gap: 2px; }
.panel .board, .variant .board { height: 100%; }
.style-panel .board .board-grid, .look-card .board .board-grid { height: 100%; }
.tabs.wrap { flex-wrap: wrap; row-gap: 0; column-gap: 18px; overflow: visible; }
.hand-notes { display: grid; gap: 2px; font-family: var(--hand); font-size: 18px; line-height: 1.1; color: var(--ink-2); }
@media (max-width: 820px) {
  .home-hero { gap: 22px; }
  .h-xl { font-size: 46px; }
  .action { padding: 14px 2px; }
}

html, body { background: var(--paper); color: var(--ink); }
